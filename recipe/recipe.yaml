schema_version: 1

context:
  name: airflow-common-operators
  version: "0.7.5"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-common-operators/airflow_common_operators-${{ version }}.tar.gz
  sha256: 6d8ab9944333d8563a018f832c4e9ee61f60ecec4e63315a2716e2ec4e1966be

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-pydantic >=1.4,<1.6
    - pydantic >=2

tests:
  - python:
      imports:
        - airflow_common_operators
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Common Airflow Operators / Tasks
  description: Common Airflow Operators / Tasks
  homepage: https://github.com/airflow-laminar/airflow-common-operators
  repository: https://github.com/airflow-laminar/airflow-common-operators

extra:
  recipe-maintainers:
    - timkpaine
